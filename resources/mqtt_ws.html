<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>vibetty · MQTT debug</title>

<!-- UI: DaisyUI 5 + Tailwind(browser build) -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<!-- MQTT over WebSocket -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<!-- xterm(text 模式渲染 screen_text 的 ANSI 流) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

<style>
  #log { white-space: pre-wrap; word-break: break-all; }
  #screenImg { image-rendering: pixelated; max-width: 100%; }
  #term { height: 100%; }
  .term-wrap { background:#000; border-radius:.5rem; overflow:hidden; min-height:320px; }
  /* 移动端:防 iOS 输入框聚焦自动放大(字号≥16px),防横向溢出触发缩放 */
  html, body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  @media (max-width: 768px) {
    input, select, textarea { font-size: 16px !important; }
  }
  /* 触摸滚动顺滑,避免双指/双击误缩放带来的卡顿 */
  body { overscroll-behavior: contain; touch-action: manipulation; }

  /* xterm 的 helper textarea 不接焦点:我们用全局 keydown 自己发 pty_in,
     不让 xterm 内部 textarea 抢键盘(否则点终端文字区英文发不出去)。 */
  .xterm-helper-textarea { pointer-events: none !important; }
  /* 隐藏的键盘接收器:点终端区时焦点导到这里(它是 input,能弹 IME;又透明覆盖在屏幕上,
     不影响显示)。我们读它的值发 pty_in,不让 xterm 参与键盘。 */
  #kbdSink { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; outline: none; background: transparent; color: transparent; caret-color: transparent; z-index: 5; cursor: text; }

  /* 移动端(≤768px):屏幕占 70vh,按键+text 固定底部,日志/会话用 tab 切换 */

  .mobile-only { display: none; }
  .desktop-only { display: block; }
  @media (max-width: 768px) {
    .mobile-only { display: block; }
    .desktop-only { display: none; }
    /* 整页变成固定结构:navbar + 屏幕(70vh) + 底部固定区 */
    .mobile-layout { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
    .mobile-screen { flex: 0 0 70vh; flex: 0 0 70dvh; min-height: 0; }
    .mobile-bottom { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    /* 桌面端那些 card 的多余 padding 在移动端收紧 */
    .mobile-layout .card-body { padding: .5rem; }
  }
</style>
</head>
<body class="bg-base-200 min-h-screen">

<!-- ════════ 移动端布局(≤768px) ════════ -->

    </div>
    <div class="flex items-center gap-2 text-xs">
      <input id="urlM" class="input input-bordered input-xs flex-1" value="ws://localhost:9001/mqtt">
      <input id="cidM" class="input input-bordered input-xs w-28">
    </div>
  </div>

  <!-- 屏幕(70vh 固定) -->
  <div class="mobile-screen bg-black flex items-center justify-center relative">
    <div id="screenStageM" class="h-full w-full">
      <div id="paneImgM" class="h-full w-full flex items-center justify-center">
        <img id="screenImgM" class="hidden max-h-full max-w-full" style="image-rendering: pixelated;">
      </div>
      <input id="kbdSinkM" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="键盘输入接收器" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;outline:none;background:transparent;color:transparent;caret-color:transparent;z-index:5;cursor:text;">

      <!-- 控制 tab -->

            <button id="btnSyncM" class="btn btn-xs btn-primary flex-1">开始同步</button>

<script>
const $ = id => document.getElementById(id);
const dec = new TextDecoder();
const genId = () => 'web-' + Math.random().toString(16).slice(2, 10);
$('cid').value = genId();

// broker WS URL:优先 ?broker=/?:url= 查询参数 → localStorage 记忆 → 默认本地内置 broker。
// 这样本页可单独部署(拷到任意静态主机),用链接或手动填连任意 broker。
// localStorage 可能被浏览器防跟踪/隐私模式拦(抛 SecurityError),try/catch 兜底。
const safeGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
{
  const q = new URLSearchParams(location.search);
  $('url').value = q.get('broker') || q.get('url') || safeGet('mqtt_url') || 'ws://localhost:9001/mqtt';
}

// ── xterm(text 模式)。CDN 没加载到也不能让整个脚本崩(否则所有按钮都没反应)──
// 桌面 #term + 移动 #termM 各挂一个;一个 Terminal 实例只能 open 一个容器,故建两套。
let term = null, fit = null, termM = null, fitM = null;
try {
  const opts = { theme: { background: '#000000', foreground: '#d4d4d4' }, convertEol: false, disableStdin: true, cursorBlink: false };
  term = new Terminal(opts); fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open($('term'));
  try { fit.fit(); } catch {}
  if ($('termM')) { termM = new Terminal(opts); fitM = new FitAddon.FitAddon(); termM.loadAddon(fitM); termM.open($('termM')); try { fitM.fit(); } catch {} }
} catch (e) {
  console.error('xterm init failed(文本模式将不可用,连接/JPEG 等不受影响):', e);
}
// 写入两个终端(若都存在)。
function termWrite(bytes) {
  if (term) try { term.write(bytes); } catch {}
  if (termM) try { termM.write(bytes); } catch {}
}
function fitAll() {
  if (fit) try { fit.fit(); } catch {}
  if (fitM) try { fitM.fit(); } catch {}
}
let resizeT = null;
window.addEventListener('resize', () => { fitAll(); if (resizeT) clearTimeout(resizeT); resizeT = setTimeout(() => { if (client && currentPrefix) sendSync(false); }, 300); });

// ── 键盘接收器:隐藏 input 覆盖在屏幕区。点屏幕 → 焦点进它 → 能弹 IME(中文)
//    且不被 xterm 吞(它是普通 input,我们读它的值)。keydown 处理控制键/英文,
//    compositionend 处理中文整段。每读一次就清空,避免累积。──
// 控制键映射(从 input 的 keydown 直接编码 xterm 序列,不走 input.value)。
function keyToBytes(e) {
  const k = e.key;
  if (e.ctrlKey && !e.metaKey && k.length === 1 && /[a-zA-Z]/.test(k)) return String.fromCharCode(k.toUpperCase().charCodeAt(0) - 64);
  const n = 1 + (e.shiftKey?1:0) + (e.altKey?2:0) + (e.ctrlKey?4:0);
  const mod = n > 1;
  const csi = d => mod ? `\x1b[1;${n}${d}` : `\x1b[${d}`;
  const tilde = num => mod ? `\x1b[${num};${n}~` : `\x1b[${num}~`;
  switch (k) {
    case 'Enter': return '\r'; case 'Backspace': return '\x7f'; case 'Tab': return e.shiftKey ? '\x1b[Z' : '\t';
    case 'Escape': return '\x1b';
    case 'ArrowUp': return csi('A'); case 'ArrowDown': return csi('B'); case 'ArrowRight': return csi('C'); case 'ArrowLeft': return csi('D');
    case 'Home': return csi('H'); case 'End': return csi('F');
    case 'PageUp': return tilde(5); case 'PageDown': return tilde(6); case 'Delete': return tilde(3); case 'Insert': return tilde(2);
  }
  const f1 = /^F([1-4])$/.exec(k); if (f1) return `\x1bO${'PQRS'[+f1[1]-1]}`;
  const fn = { F5:15,F6:17,F7:18,F8:19,F9:20,F10:21,F11:23,F12:24 }[k];
  if (fn) return `\x1b[${fn}~`;
  return null;
}
function publishPty(bytes) {
  if (!client || !currentPrefix || bytes == null || bytes === '') return;
  if (!kbdOn()) return;
  client.publish(`${currentPrefix}/pty_in`, bytes);
  log('out', `→ pty_in: ${typeof bytes === 'string' ? JSON.stringify(bytes) : '['+bytes.length+'B]'}`);
}
function setupKbdSink(sink) {
  if (!sink) return;
  // 控制键/方向键:keydown 编码后直接发,清掉 input.value 里可能混入的字符。
  sink.addEventListener('keydown', e => {
    if (e.isComposing) return; // 组词中交给 compositionend
    if (e.metaKey) return;
    const bytes = keyToBytes(e);
    if (bytes != null) { e.preventDefault(); publishPty(bytes); sink.value = ''; return; }
  });
  // 中文 IME 提交:compositionend 拿整段文本发,然后清空 input。
  sink.addEventListener('compositionend', e => {
    if (e.data) { publishPty(e.data); }
    sink.value = '';
  });
  // 英文/可打印字符:input 事件(非 composition)拿 input.value 发,清空。这样英文也走 input,
  // 不被 keydown 拦(部分浏览器英文 keydown 的 e.key 可能被 IME 改)。
  sink.addEventListener('input', e => {
    if (e.isComposing) return; // 组词中不处理,等 compositionend
    if (sink.value) { publishPty(sink.value); sink.value = ''; }
  });
}
setupKbdSink($('kbdSink'));
setupKbdSink($('kbdSinkM'));
// 点屏幕区(桌面 screenStage / 移动 screenStageM)→ 焦点导到对应的 kbdSink。
for (const [stageId, sinkId] of [['screenStage','kbdSink'], ['screenStageM','kbdSinkM']]) {
  const stage = $(stageId);
  if (stage) stage.addEventListener('mousedown', e => {
    if (e.target === $(sinkId)) return; // 点的就是 input 本身,不重复
    e.preventDefault();
    setTimeout(() => $(sinkId) && $(sinkId).focus(), 0);
  });
}

// ── 日志(桌面 #log + 移动 #logM)──
function log(cls, msg) {
  const t = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = ({ in:'text-success', out:'text-info', sys:'text-warning', err:'text-error' })[cls] || '';
  line.textContent = `[${t}] ${msg}`;
  for (const el of [$('log'), $('logM')]) if (el) { el.appendChild(line.cloneNode(true)); el.scrollTop = el.scrollHeight; }
}
const clearLog = () => { for (const el of [$('log'), $('logM')]) if (el) el.innerHTML = ''; };
$('btnClearLog').onclick = clearLog;
if ($('btnClearLogM')) $('btnClearLogM').onclick = clearLog;
$('btnToggleLog').onclick = () => { const hidden = $('logWrap').classList.toggle('hidden'); $('logArrow').textContent = hidden ? '▶' : '▼'; };

// ── 状态(桌面 + 移动)──
let client = null, currentPrefix = null, currentFormat = null;
const setStatus = (txt, kind='ghost') => {
  for (const id of ['status', 'statusM']) { const s = $(id); if (s) { s.textContent = txt; s.className = 'badge badge-sm badge-' + kind; } }
};
const setConnected = on => {
  for (const [c, d] of [['btnConnect','btnDisconnect'], ['btnConnectM','btnDisconnectM']]) {
    if ($(c)) $(c).disabled = on; if ($(d)) $(d).disabled = !on;
  }
};

function showPane(format) {
  const text = (format === 'text');
  for (const ids of [['paneText','paneImg'], ['paneTextM','paneImgM']]) {
    const [tEl, iEl] = ids.map($);
    if (tEl) tEl.classList.toggle('hidden', !text);
    if (iEl) iEl.classList.toggle('hidden', text);
  }
  if (text) fitAll();
}

// ── 屏幕显示(JPEG 桌面 #screenImg + 移动 #screenImgM)──
let lastBlob = null;
function showImg(bytes) {
  if (lastBlob) URL.revokeObjectURL(lastBlob);
  const blob = new Blob([bytes], { type: 'image/jpeg' });
  lastBlob = URL.createObjectURL(blob);
  for (const id of ['screenImg', 'screenImgM']) { const img = $(id); if (img) { img.src = lastBlob; img.classList.remove('hidden'); } }
  const info = `${bytes.length}B · ${new Date().toLocaleTimeString()}`;
  for (const id of ['screenInfo', 'screenInfoM']) if ($(id)) $(id).textContent = info;
}

// ── 在线会话列表:presence 发现 → 列出来;点选才订阅 + 发 sync close=false;
//    「断开」发 sync close=true 告诉 tty 别再推。working/waiting 标题颜色不同。──
const instances = new Map(); // prefix -> {prefix,title,state,format,ts}
const escapeHtml = s => (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function renderSessions() {
  const boxes = ['sessions', 'sessionsM'].map($).filter(Boolean);
  if (instances.size === 0) {
    const ph = '<span class="text-sm opacity-40">(等待 presence 发现实例…)</span>';
    boxes.forEach(b => b.innerHTML = ph); return;
  }
  boxes.forEach(box => {
    box.innerHTML = '';
    for (const [, ins] of instances) {
      const active = ins.prefix === currentPrefix;
      const stateCls = ins.state === 'waiting' ? 'text-warning' : ins.state === 'working' ? 'text-success' : '';
      const chip = document.createElement('div');
      chip.className = 'w-full px-2 py-1 rounded cursor-pointer text-sm flex items-center gap-2 border'
        + (active ? ' border-primary bg-primary/10' : ' border-base-300 hover:bg-base-300');
      chip.title = ins.prefix;
      chip.innerHTML = `<span class="${stateCls} font-semibold truncate max-w-[260px]">${escapeHtml(ins.title || ins.prefix)}</span>`
        + `<span class="badge badge-xs badge-outline">${ins.format || '?'}</span>`
        + `<span class="text-xs opacity-40">${escapeHtml(ins.state || '')}</span>`;
      chip.onclick = () => selectSession(ins.prefix);
      box.appendChild(chip);
    }
  });
}

// btnDisc 桌面+移动同步开关。
const setDiscDisabled = (on) => { for (const id of ['btnDisc', 'btnDiscM']) if ($(id)) $(id).disabled = on; };

function selectSession(prefix) {
  if (!client) { log('err', '未连接'); return; }
  if (prefix === currentPrefix) { sendSync(false); return; } // 已选中再点 → 重新刷屏
  const ins = instances.get(prefix);
  // 旧的:发 close=true 停推 + 退订
  if (currentPrefix) {
    publishSync(currentPrefix, currentFormat, true);
    client.unsubscribe((currentFormat === 'text') ? `${currentPrefix}/screen_text` : `${currentPrefix}/screen`);
  }
  currentPrefix = prefix;
  currentFormat = ins ? (ins.format || currentFormat) : currentFormat;
  setDiscDisabled(false);
  showPane(currentFormat);
  renderSessions();
  log('sys', `查看会话: ${prefix} (format=${currentFormat})`);
  // 新的:订阅 + sync close=false(让它发屏)
  const t = (currentFormat === 'text') ? `${prefix}/screen_text` : `${prefix}/screen`;
  client.subscribe(t, e => e ? log('err', `订阅失败 ${t}: ${e}`) : log('out', `→ 订阅 ${t}`));
  sendSync(false);
  if ($('tabSessionsM')) switchMobileTab('ctrl'); // 选中后跳回控制 tab
}

function disconnectSession() {
  if (!client || !currentPrefix) return;
  sendSync(true); // 告诉 tty 不用再发了
  client.unsubscribe((currentFormat === 'text') ? `${currentPrefix}/screen_text` : `${currentPrefix}/screen`);
  log('out', `断开会话(已发 close=true): ${currentPrefix}`);
  currentPrefix = null;
  setDiscDisabled(true);
  renderSessions();
}

function onMessage(topic, payload) {
  const bytes = new Uint8Array(payload);
  const segs = topic.split('/');
  // presence:[user, device, pid, "vibetty"]
  if (segs.length === 4 && segs[3] === 'vibetty') {
    if (bytes.length === 0) {
      instances.delete(topic);
      if (topic === currentPrefix) { currentPrefix = null; setDiscDisabled(true); }
      log('sys', `${topic}: 下线(LWT 空 payload)`);
      renderSessions();
      return;
    }
    let p; try { p = JSON.parse(dec.decode(bytes)); } catch { return; }
    log('in', `presence: ${JSON.stringify(p)}`);
    if (p && p.prefix) {
      instances.set(p.prefix, { prefix: p.prefix, title: p.title || '', state: p.state || '', format: p.format || null, ts: p.ts });
      if (p.prefix === currentPrefix && p.format) currentFormat = p.format; // 跟踪当前会话 format 变化
      renderSessions();
    }
    return;
  }
  if (topic.endsWith('/screen')) {
    // JPEG(+ 末尾 4 字节 offset trailer,解码器忽略)
    const isJpeg = bytes.length >= 3 && bytes[0]===0xff && bytes[1]===0xd8 && bytes[2]===0xff;
    if (isJpeg) showImg(bytes, topic);
    return;
  }
  if (topic.endsWith('/screen_text')) {
    // 首字节 tag:0x00=全屏基线,0x01=增量。xterm 直接吃 ANSI 流(桌面+移动都写)。
    if (bytes.length >= 1) termWrite(bytes.subarray(1));
    return;
  }
  // 其它(pty_in 回显之类)
  const txt = dec.decode(bytes);
  log('in', `← ${topic}: ${txt}`);
}

// ── 连接 ──
// 校验 broker WS URL:必须 ws/wss 开头,且路径以 /mqtt 结尾(EMQX 要求;内置 broker 也接受)。
function validateUrl(url) {
  if (!/^wss?:\/\//i.test(url)) return 'URL 须 ws:// 或 wss:// 开头';
  try {
    const u = new URL(url);
    if (!u.pathname.endsWith('/mqtt')) return 'URL 路径必须以 /mqtt 结尾(如 ws://host:9001/mqtt)';
    return null;
  } catch { return 'URL 格式无效'; }
}
// 从桌面或移动端的 URL/cid 输入框取值(谁可见用谁;移动端可能改了桌面没改)。
function readUrlCid() {
  const urlEl = $('url').offsetParent ? $('url') : $('urlM');
  const cidEl = $('cid').offsetParent ? $('cid') : $('cidM');
  const url = (urlEl && urlEl.value) ? urlEl.value.trim() : ($('url').value || $('urlM').value).trim();
  const cid = ((cidEl && cidEl.value) ? cidEl.value.trim() : '') || genId();
  // 同步两边显示
  if ($('url')) $('url').value = url; if ($('urlM')) $('urlM').value = url;
  if ($('cid')) $('cid').value = cid; if ($('cidM')) $('cidM').value = cid;
  return { url, cid };
}
function doConnect() {
  if (client) return;
  const { url, cid } = readUrlCid();
  const verr = validateUrl(url);
  if (verr) { log('err', verr); setStatus('URL 有误', 'error'); return; }
  safeSet('mqtt_url', url);
  log('sys', `连接 ${url} (client_id=${cid}) …`);
  setStatus('连接中…', 'warning');
  try { client = mqtt.connect(url, { clientId: cid, clean: true, reconnectPeriod: 0 }); }
  catch (e) { log('err', `连接异常: ${e}`); setStatus('错误', 'error'); return; }
  let everConnected = false;
  client.on('connect', () => {
    everConnected = true;
    setStatus('已连接', 'success'); setConnected(true); log('sys', '已连接');
    client.subscribe('+/+/+/vibetty', e => e ? log('err', `订阅 presence 失败: ${e}`) : log('out', '→ 订阅 +/+/+/vibetty'));
  });
  client.on('error', e => {
    // MQTT 层错误(auth/协议)。浏览器 WS 连接失败时多半只触发 close,这里尽力打印收到的。
    const m = e && (e.message || e.code || e);
    log('err', `错误: ${typeof m === 'object' ? JSON.stringify(m) : m}`);
    setStatus('错误', 'error');
  });
  client.on('offline', () => log('sys', '离线'));
  client.on('close', () => {
    if (!everConnected) {
      log('err', '连接失败 —— 检查:broker 地址/端口是否对、路径是否以 /mqtt 结尾、wss 证书是否有效、以及 https 页面不能连 ws://(mixed content 会被浏览器拦)');
      setStatus('连接失败', 'error');
    } else {
      log('sys', '连接关闭');
      setStatus('未连接', 'ghost');
    }
    setConnected(false);
    currentPrefix = null;
  });
  client.on('message', onMessage);
}
$('btnConnect').onclick = doConnect;
if ($('btnConnectM')) $('btnConnectM').onclick = doConnect;
function doDisconnect() {
  if (!client) return;
  client.end(true); client = null; setConnected(false); setStatus('未连接', 'ghost');
  currentPrefix = null; log('sys', '已断开');
}
$('btnDisconnect').onclick = doDisconnect;
if ($('btnDisconnectM')) $('btnDisconnectM').onclick = doDisconnect;

// ── 发送 ──
function needClient() { if (!client) { log('err', '未连接'); return false; } return true; }
function needPrefix() { if (!currentPrefix) { log('err', '先点一个在线会话'); return null; } return currentPrefix; }

// sync 尺寸:text 用 xterm fit 后的真实 cols/rows(它才反映终端实际显示的列行);
// jpeg 按可见屏幕区像素减去两侧 16px padding 后按 8×18 字符格换算。都发 cells(pixels=false)。
function paneSizeFor(format) {
  fitAll();
  if (format === 'text') {
    // text:用 xterm fit 后的真实 cols/rows(可见的那个)。它自带字符尺寸,比前端按像素猜准。
    const tM = termM && termM.element && termM.element.offsetParent ? termM : null;
    const tD = term && term.element && term.element.offsetParent ? term : null;
    const t = tM || tD || term || termM;
    return { pixels: false, w: t ? t.cols : 80, h: t ? t.rows : 24 };
  }
  // jpeg:量可见屏幕区像素,减掉 vibetty 的两侧 16px padding(共 32),按 8×18 字符格算 cols/rows。
  const el = ($('screenStageM') && $('screenStageM').offsetParent) ? $('screenStageM') : $('screenStage');
  const availW = Math.max(el.clientWidth - 32, 64);
  const availH = Math.max(el.clientHeight - 32, 64);
  return { pixels: false, w: Math.max(8, Math.floor(availW / 8)), h: Math.max(2, Math.floor(availH / 18)) };
}
// 向指定 prefix 发 sync(close=false=让它发屏 / true=叫它别发)。
function publishSync(prefix, format, close) {
  if (!client) return;
  const { pixels, w, h } = paneSizeFor(format);
  if (prefix === currentPrefix && $('syncSize')) $('syncSize').textContent = `${w}×${h} cells`;
  const payload = JSON.stringify({ type: 'sync', data: { width: w, height: h, pixels, close } });
  client.publish(`${prefix}/control`, payload,
    e => e ? log('err', `发送失败: ${e}`) : log('out', `→ ${prefix}/control: ${payload}`));
}
// 对当前选中会话发 sync。forceClose:undefined=默认 false(开始同步),true=停止 ptyout。
function sendSync(forceClose) {
  if (!client || !currentPrefix) return;
  publishSync(currentPrefix, currentFormat, forceClose === true);
}
// 「开始同步」按钮:发 sync close=false(让服务端推屏)。
$('btnSync').onclick = () => { if (needClient() && needPrefix()) sendSync(false); };
if ($('btnSyncM')) $('btnSyncM').onclick = () => { if (needClient() && needPrefix()) sendSync(false); };
// 「停止 ptyout」按钮:发 sync close=true(叫服务端别再自主推屏)。
function stopPty() { if (needClient() && needPrefix()) sendSync(true); }
if ($('btnStopPty')) $('btnStopPty').onclick = stopPty;
if ($('btnStopPtyM')) $('btnStopPtyM').onclick = stopPty;
$('btnDisc').onclick = disconnectSession;
if ($('btnDiscM')) $('btnDiscM').onclick = disconnectSession;

// text 命令发送(桌面 #cmd / 移动 #cmdM,取可见的)。
function sendCmd() {
  if (!needClient() || !needPrefix()) return;
  const el = $('cmdM').offsetParent ? $('cmdM') : $('cmd');
  const text = el.value + '\n';
  const payload = JSON.stringify({ type: 'input_text', data: text });
  client.publish(`${currentPrefix}/control`, payload,
    e => e ? log('err', `发送失败: ${e}`) : log('out', `→ control: ${payload}`));
  el.value = '';
}
$('btnCmd').onclick = sendCmd;
if ($('btnCmdM')) $('btnCmdM').onclick = sendCmd;
$('cmd').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendCmd(); } });
if ($('cmdM')) $('cmdM').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendCmd(); } });

// ── 按键 / 滚动按钮(raw 字节走 pty_in;scroll 走 control)──
const KEY_BYTES = { up:'\x1b[A', down:'\x1b[B', stab:'\x1b[Z', bs:'\x7f', enter:'\r', ctrlc:'\x03' };
function sendPty(bytes) {
  if (!needClient() || !needPrefix()) return;
  client.publish(`${currentPrefix}/pty_in`, bytes, e => e ? log('err', `发送失败: ${e}`) : null);
}
function sendScroll(up) {
  if (!needClient() || !needPrefix()) return;
  const payload = JSON.stringify({ type: up ? 'scroll_up' : 'scroll_down', data: { rows: 0 } });
  client.publish(`${currentPrefix}/control`, payload, e => e ? log('err', `发送失败: ${e}`) : log('out', `→ control: ${payload}`));
}
document.querySelectorAll('[data-act],[data-key]').forEach(b => b.onclick = () => {
  const act = b.dataset.act, key = b.dataset.key;
  if (act) sendScroll(act === 'up');
  else if (key && KEY_BYTES[key]) sendPty(KEY_BYTES[key]);
});

// ── 主题切换 ──
document.querySelectorAll('[data-set-theme]').forEach(a => a.onclick = () => {
  document.documentElement.setAttribute('data-theme', a.getAttribute('data-set-theme'));
});

// 取「可见且勾选」的键盘直输开关(桌面 #kbdCapture / 移动 #kbdCaptureM)。kbdSink 的
// 事件处理会先查它,关掉就不发(让用户能临时禁用键盘直输)。
function kbdOn() {
  for (const id of ['kbdCapture', 'kbdCaptureM']) {
    const el = $(id);
    if (el && el.offsetParent !== null && el.checked) return true;
  }
  return false;
}
// kbdSink 的事件处理(上面 setupKbdSink 已绑)用 kbdOn 做开关;这里再包一道:
//   上面 setupKbdSink 里 publishPty 已带 client/currentPrefix 判定,加 kbdOn 在 publishPty 里。
// (publishPty 已在上方定义,这里不动。)

// ── 移动端 tab 切换(控制 / 会话 / 日志)──
function switchMobileTab(name) {
  const map = { ctrl: ['paneCtrlM', 'tabCtrl'], sessions: ['paneSessionsM', 'tabSessions'], log: ['paneLogM', 'tabLog'] };
  for (const [n, [pane, tab]] of Object.entries(map)) {
    $(pane).classList.toggle('hidden', n !== name);
    $(tab).classList.toggle('tab-active', n === name);
  }
  if (name === 'log' && $('logM')) $('logM').scrollTop = $('logM').scrollHeight;
}
['tabCtrl', 'tabSessions', 'tabLog'].forEach(id => {
  if ($(id)) $(id).onclick = () => switchMobileTab(id.slice(3).replace('Ctrl', 'ctrl').replace('Sessions', 'sessions').replace('Log', 'log'));
});

setStatus('未连接', 'ghost');
renderSessions();
</script>
</body>
</html>
