<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibetty · MQTT debug</title>

<!-- UI: DaisyUI 5 + Tailwind(browser build) -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<!-- MQTT over WebSocket -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<!-- xterm(text 模式渲染 screen_text 的 ANSI 流) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

<style>
  #log { white-space: pre-wrap; word-break: break-all; }
  #screenImg { image-rendering: pixelated; max-width: 100%; }
  #term { height: 100%; }
  .term-wrap { background:#000; border-radius:.5rem; overflow:hidden; min-height:320px; }
</style>
</head>
<body class="bg-base-200 min-h-screen">
<div class="container mx-auto p-3 flex flex-col gap-3">

  <!-- Navbar -->
  <div class="navbar bg-base-100 rounded-box shadow flex-wrap gap-2">
    <div class="navbar-start">
      <div class="text-lg font-bold">vibetty <span class="text-base-content/50 text-sm font-normal">MQTT debug</span></div>
    </div>
    <div class="navbar-end gap-2 flex items-center">
      <span id="status" class="badge badge-ghost badge-sm">未连接</span>
      <button id="btnConnect" class="btn btn-primary btn-sm">连接</button>
      <button id="btnDisconnect" class="btn btn-ghost btn-sm" disabled>断开</button>
    </div>
  </div>

  <!-- 连接 / 实例 -->
  <div class="card bg-base-100 shadow compact">
    <div class="card-body p-3 flex-wrap gap-3">
      <div class="flex flex-wrap items-center gap-2 text-sm">
        <span class="opacity-60">broker WS</span>
        <input id="url" class="input input-bordered input-sm w-72" value="ws://localhost:9001/mqtt" title="必须 ws:// 或 wss:// 开头,且路径以 /mqtt 结尾">
        <span class="text-xs opacity-50">须 <code>/mqtt</code> 结尾</span>
        <span class="opacity-60">client id</span>
        <input id="cid" class="input input-bordered input-sm w-40">
        <div class="dropdown dropdown-end ml-auto">
          <div tabindex="0" role="button" class="btn btn-ghost btn-sm">主题</div>
          <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box w-40 p-2 shadow">
            <li><a data-set-theme="dark">Dark</a></li>
            <li><a data-set-theme="light">Light</a></li>
            <li><a data-set-theme="synthwave">Synthwave</a></li>
            <li><a data-set-theme="cyberpunk">Cyberpunk</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- 主区:屏幕(左/主) + 会话列表(右,竖排) -->
  <div class="grid md:grid-cols-[1fr_248px] gap-3 flex-1 min-h-0">
    <!-- 屏幕 -->
    <div class="card bg-base-100 shadow compact min-h-0">
      <div class="card-body p-3 min-h-0">
        <div class="flex items-center justify-between mb-1">
          <span class="text-sm opacity-60">屏幕</span>
          <span id="screenInfo" class="text-xs opacity-50"></span>
        </div>
        <div id="screenStage" style="height:60vh; min-height:300px;">
          <!-- JPEG 模式 -->
          <div id="paneImg" class="h-full flex items-center justify-center">
            <img id="screenImg" class="hidden rounded">
          </div>
          <!-- text 模式 -->
          <div id="paneText" class="term-wrap h-full hidden">
            <div id="term"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- 会话列表(右,竖排) -->
    <div class="card bg-base-100 shadow compact min-h-0">
      <div class="card-body p-3 flex flex-col min-h-0">
        <div class="flex items-center justify-between mb-1">
          <span class="text-sm opacity-60">在线会话<span class="text-xs opacity-40 ml-1">(working 绿/waiting 黄)</span></span>
          <button id="btnDisc" class="btn btn-ghost btn-xs" disabled>断开</button>
        </div>
        <div id="sessions" class="flex flex-col gap-2 overflow-auto"></div>
      </div>
    </div>
  </div>

  <!-- 输入控制 -->
  <div class="card bg-base-100 shadow compact">
    <div class="card-body p-3 flex flex-col gap-2 text-sm">
      <div class="flex flex-wrap items-center gap-2">
        <span class="opacity-60 w-28">text</span>
        <input id="cmd" class="input input-bordered input-sm flex-1 min-w-[120px]" placeholder="input_text(自动加换行,回车发送)">
        <button id="btnCmd" class="btn btn-sm">发送</button>
        <label class="flex items-center gap-1 ml-auto text-xs"><input id="kbdCapture" type="checkbox" class="checkbox checkbox-xs" checked> 键盘直输</label>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <span class="opacity-60 w-28">按键 / 滚动</span>
        <button class="btn btn-xs" data-act="up">scroll ↑</button>
        <button class="btn btn-xs" data-act="down">scroll ↓</button>
        <span class="opacity-30">·</span>
        <button class="btn btn-xs" data-key="up" title="方向键上">↑</button>
        <button class="btn btn-xs" data-key="down" title="方向键下">↓</button>
        <button class="btn btn-xs" data-key="stab" title="shift+tab">yolo</button>
        <button class="btn btn-xs" data-key="bs" title="退格">⌫</button>
        <button class="btn btn-xs btn-primary" data-key="enter" title="回车">⏎</button>
        <button class="btn btn-xs btn-error" data-key="ctrlc" title="Ctrl+C 中断">^C</button>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <span class="opacity-60 w-28">sync</span>
        <span id="syncSize" class="text-xs opacity-50">(按屏幕区尺寸自动)</span>
        <label class="flex items-center gap-1"><input id="syncClose" type="checkbox" class="checkbox checkbox-sm"> close</label>
        <button id="btnSync" class="btn btn-sm btn-primary">sync(刷屏)</button>
      </div>
    </div>
  </div>

  <!-- 消息日志(最底,可折叠) -->
  <div class="card bg-base-100 shadow compact">
    <div class="card-body p-3">
      <div class="flex items-center justify-between mb-1">
        <button id="btnToggleLog" class="text-sm opacity-60 flex items-center gap-1">消息日志 <span id="logArrow">▼</span></button>
        <button id="btnClearLog" class="btn btn-ghost btn-xs">清空</button>
      </div>
      <div id="logWrap">
        <div id="log" class="bg-black text-xs font-mono p-2 rounded h-[180px] overflow-auto"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const dec = new TextDecoder();
const genId = () => 'web-' + Math.random().toString(16).slice(2, 10);
$('cid').value = genId();

// broker WS URL:优先 ?broker=/?:url= 查询参数 → localStorage 记忆 → 默认本地内置 broker。
// 这样本页可单独部署(拷到任意静态主机),用链接或手动填连任意 broker。
// localStorage 可能被浏览器防跟踪/隐私模式拦(抛 SecurityError),try/catch 兜底。
const safeGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
{
  const q = new URLSearchParams(location.search);
  $('url').value = q.get('broker') || q.get('url') || safeGet('mqtt_url') || 'ws://localhost:9001/mqtt';
}

// ── xterm(text 模式)。CDN 没加载到也不能让整个脚本崩(否则所有按钮都没反应)──
let term = null, fit = null;
try {
  term = new Terminal({ theme: { background: '#000000', foreground: '#d4d4d4' }, convertEol: false, disableStdin: true, cursorBlink: false });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($('term'));
  try { fit.fit(); } catch {}
} catch (e) {
  console.error('xterm init failed(文本模式将不可用,连接/JPEG 等不受影响):', e);
}
let resizeT = null;
window.addEventListener('resize', () => {
  if (fit) { try { fit.fit(); } catch {} }
  if (resizeT) clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (client && currentPrefix) sendSync(false); }, 300);
});

// ── 日志 ──
const logEl = $('log');
function log(cls, msg) {
  const t = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = ({ in:'text-success', out:'text-info', sys:'text-warning', err:'text-error' })[cls] || '';
  line.textContent = `[${t}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
$('btnClearLog').onclick = () => logEl.innerHTML = '';
$('btnToggleLog').onclick = () => {
  const hidden = $('logWrap').classList.toggle('hidden');
  $('logArrow').textContent = hidden ? '▶' : '▼';
};

// ── 状态 ──
let client = null, currentPrefix = null, currentFormat = null, lastUrl = null;
const setStatus = (txt, kind='ghost') => { const s = $('status'); s.textContent = txt; s.className = 'badge badge-sm badge-' + kind; };
const setConnected = on => { $('btnConnect').disabled = on; $('btnDisconnect').disabled = !on; };

function showPane(format) {
  const text = (format === 'text');
  $('paneText').classList.toggle('hidden', !text);
  $('paneImg').classList.toggle('hidden', text);
  if (text && fit) { try { fit.fit(); } catch {} }
}

// ── 屏幕显示 ──
let lastBlob = null;
function showImg(bytes, topic) {
  if (lastBlob) URL.revokeObjectURL(lastBlob);
  const blob = new Blob([bytes], { type: 'image/jpeg' });
  lastBlob = URL.createObjectURL(blob);
  const img = $('screenImg');
  img.src = lastBlob;
  img.classList.remove('hidden');
  $('screenInfo').textContent = `${bytes.length}B · ${new Date().toLocaleTimeString()}`;
}

// ── 在线会话列表:presence 发现 → 列出来;点选才订阅 + 发 sync close=false;
//    「断开」发 sync close=true 告诉 tty 别再推。working/waiting 标题颜色不同。──
const instances = new Map(); // prefix -> {prefix,title,state,format,ts}
const escapeHtml = s => (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function renderSessions() {
  const box = $('sessions');
  if (instances.size === 0) { box.innerHTML = '<span class="text-sm opacity-40">(等待 presence 发现实例…)</span>'; return; }
  box.innerHTML = '';
  for (const [, ins] of instances) {
    const active = ins.prefix === currentPrefix;
    const stateCls = ins.state === 'waiting' ? 'text-warning'
                   : ins.state === 'working' ? 'text-success' : '';
    const chip = document.createElement('div');
    chip.className = 'w-full px-2 py-1 rounded cursor-pointer text-sm flex items-center gap-2 border'
      + (active ? ' border-primary bg-primary/10' : ' border-base-300 hover:bg-base-300');
    chip.title = ins.prefix;
    chip.innerHTML = `<span class="${stateCls} font-semibold truncate max-w-[260px]">${escapeHtml(ins.title || ins.prefix)}</span>`
      + `<span class="badge badge-xs badge-outline">${ins.format || '?'}</span>`
      + `<span class="text-xs opacity-40">${escapeHtml(ins.state || '')}</span>`;
    chip.onclick = () => selectSession(ins.prefix);
    box.appendChild(chip);
  }
}

function selectSession(prefix) {
  if (!client) { log('err', '未连接'); return; }
  if (prefix === currentPrefix) { sendSync(false); return; } // 已选中再点 → 重新刷屏
  const ins = instances.get(prefix);
  // 旧的:发 close=true 停推 + 退订
  if (currentPrefix) {
    publishSync(currentPrefix, currentFormat, true);
    client.unsubscribe((currentFormat === 'text') ? `${currentPrefix}/screen_text` : `${currentPrefix}/screen`);
  }
  currentPrefix = prefix;
  currentFormat = ins ? (ins.format || currentFormat) : currentFormat;
  $('btnDisc').disabled = false;
  showPane(currentFormat);
  renderSessions();
  log('sys', `查看会话: ${prefix} (format=${currentFormat})`);
  // 新的:订阅 + sync close=false(让它发屏)
  const t = (currentFormat === 'text') ? `${prefix}/screen_text` : `${prefix}/screen`;
  client.subscribe(t, e => e ? log('err', `订阅失败 ${t}: ${e}`) : log('out', `→ 订阅 ${t}`));
  sendSync(false);
}

function disconnectSession() {
  if (!client || !currentPrefix) return;
  sendSync(true); // 告诉 tty 不用再发了
  client.unsubscribe((currentFormat === 'text') ? `${currentPrefix}/screen_text` : `${currentPrefix}/screen`);
  log('out', `断开会话(已发 close=true): ${currentPrefix}`);
  currentPrefix = null;
  $('btnDisc').disabled = true;
  renderSessions();
}

function onMessage(topic, payload) {
  const bytes = new Uint8Array(payload);
  const segs = topic.split('/');
  // presence:[user, device, pid, "vibetty"]
  if (segs.length === 4 && segs[3] === 'vibetty') {
    if (bytes.length === 0) {
      instances.delete(topic);
      if (topic === currentPrefix) { currentPrefix = null; $('btnDisc').disabled = true; }
      log('sys', `${topic}: 下线(LWT 空 payload)`);
      renderSessions();
      return;
    }
    let p; try { p = JSON.parse(dec.decode(bytes)); } catch { return; }
    log('in', `presence: ${JSON.stringify(p)}`);
    if (p && p.prefix) {
      instances.set(p.prefix, { prefix: p.prefix, title: p.title || '', state: p.state || '', format: p.format || null, ts: p.ts });
      if (p.prefix === currentPrefix && p.format) currentFormat = p.format; // 跟踪当前会话 format 变化
      renderSessions();
    }
    return;
  }
  if (topic.endsWith('/screen')) {
    // JPEG(+ 末尾 4 字节 offset trailer,解码器忽略)
    const isJpeg = bytes.length >= 3 && bytes[0]===0xff && bytes[1]===0xd8 && bytes[2]===0xff;
    if (isJpeg) showImg(bytes, topic);
    return;
  }
  if (topic.endsWith('/screen_text')) {
    // 首字节 tag:0x00=全屏基线,0x01=增量。xterm 直接吃 ANSI 流。
    if (term && bytes.length >= 1) term.write(bytes.subarray(1));
    return;
  }
  // 其它(pty_in 回显之类)
  const txt = dec.decode(bytes);
  log('in', `← ${topic}: ${txt}`);
}

// ── 连接 ──
// 校验 broker WS URL:必须 ws/wss 开头,且路径以 /mqtt 结尾(EMQX 要求;内置 broker 也接受)。
function validateUrl(url) {
  if (!/^wss?:\/\//i.test(url)) return 'URL 须 ws:// 或 wss:// 开头';
  try {
    const u = new URL(url);
    if (!u.pathname.endsWith('/mqtt')) return 'URL 路径必须以 /mqtt 结尾(如 ws://host:9001/mqtt)';
    return null;
  } catch { return 'URL 格式无效'; }
}
$('btnConnect').onclick = () => {
  if (client) return;
  const url = $('url').value.trim();
  const cid = $('cid').value.trim() || genId();
  const verr = validateUrl(url);
  if (verr) { log('err', verr); setStatus('URL 有误', 'error'); return; }
  safeSet('mqtt_url', url);
  log('sys', `连接 ${url} (client_id=${cid}) …`);
  setStatus('连接中…', 'warning');
  try { client = mqtt.connect(url, { clientId: cid, clean: true, reconnectPeriod: 0 }); }
  catch (e) { log('err', `连接异常: ${e}`); setStatus('错误', 'error'); return; }
  let everConnected = false;
  client.on('connect', () => {
    everConnected = true;
    setStatus('已连接', 'success'); setConnected(true); log('sys', '已连接');
    client.subscribe('+/+/+/vibetty', e => e ? log('err', `订阅 presence 失败: ${e}`) : log('out', '→ 订阅 +/+/+/vibetty'));
  });
  client.on('error', e => {
    // MQTT 层错误(auth/协议)。浏览器 WS 连接失败时多半只触发 close,这里尽力打印收到的。
    const m = e && (e.message || e.code || e);
    log('err', `错误: ${typeof m === 'object' ? JSON.stringify(m) : m}`);
    setStatus('错误', 'error');
  });
  client.on('offline', () => log('sys', '离线'));
  client.on('close', () => {
    if (!everConnected) {
      log('err', '连接失败 —— 检查:broker 地址/端口是否对、路径是否以 /mqtt 结尾、wss 证书是否有效、以及 https 页面不能连 ws://(mixed content 会被浏览器拦)');
      setStatus('连接失败', 'error');
    } else {
      log('sys', '连接关闭');
      setStatus('未连接', 'ghost');
    }
    setConnected(false);
    currentPrefix = null;
  });
  client.on('message', onMessage);
};
$('btnDisconnect').onclick = () => {
  if (!client) return;
  client.end(true); client = null; setConnected(false); setStatus('未连接', 'ghost');
  currentPrefix = null; log('sys', '已断开');
};

// ── 发送 ──
function needClient() { if (!client) { log('err', '未连接'); return false; } return true; }
function needPrefix() { if (!currentPrefix) { log('err', '先点一个在线会话'); return null; } return currentPrefix; }

// sync 尺寸按当前屏幕区自动:text 用 xterm cols/rows;JPEG 用屏幕区像素。
function paneSizeFor(format) {
  if (format === 'text') return { pixels: false, w: term ? term.cols : 80, h: term ? term.rows : 24 };
  const el = $('screenStage');
  return { pixels: true, w: Math.max(el.clientWidth, 64), h: Math.max(el.clientHeight, 64) };
}
// 向指定 prefix 发 sync(close=false=让它发屏 / true=叫它别发)。
function publishSync(prefix, format, close) {
  if (!client) return;
  const { pixels, w, h } = paneSizeFor(format);
  if (prefix === currentPrefix) $('syncSize').textContent = pixels ? `${w}×${h} px` : `${w}×${h} cells`;
  const payload = JSON.stringify({ type: 'sync', data: { width: w, height: h, pixels, close } });
  client.publish(`${prefix}/control`, payload,
    e => e ? log('err', `发送失败: ${e}`) : log('out', `→ ${prefix}/control: ${payload}`));
}
// 对当前选中会话发 sync(manual 「sync 刷屏」按钮 / 窗口 resize 用)。close 跟随勾选。
function sendSync(forceClose) {
  if (!client || !currentPrefix) return;
  const close = (forceClose === undefined) ? $('syncClose').checked : forceClose;
  publishSync(currentPrefix, currentFormat, close);
}
$('btnSync').onclick = () => { if (needClient() && needPrefix()) sendSync(); };
$('btnDisc').onclick = disconnectSession;

$('btnCmd').onclick = () => {
  if (!needClient() || !needPrefix()) return;
  const text = $('cmd').value + '\n';
  const payload = JSON.stringify({ type: 'input_text', data: text });
  client.publish(`${currentPrefix}/control`, payload,
    e => e ? log('err', `发送失败: ${e}`) : log('out', `→ control: ${payload}`));
};
// 焦点在 text 输入框时,回车直接发送。
$('cmd').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('btnCmd').click(); } });

// ── 按键 / 滚动按钮(raw 字节走 pty_in;scroll 走 control)──
const KEY_BYTES = { up:'\x1b[A', down:'\x1b[B', stab:'\x1b[Z', bs:'\x7f', enter:'\r', ctrlc:'\x03' };
function sendPty(bytes) {
  if (!needClient() || !needPrefix()) return;
  client.publish(`${currentPrefix}/pty_in`, bytes, e => e ? log('err', `发送失败: ${e}`) : null);
}
function sendScroll(up) {
  if (!needClient() || !needPrefix()) return;
  const payload = JSON.stringify({ type: up ? 'scroll_up' : 'scroll_down', data: { rows: 0 } });
  client.publish(`${currentPrefix}/control`, payload, e => e ? log('err', `发送失败: ${e}`) : log('out', `→ control: ${payload}`));
}
document.querySelectorAll('[data-act],[data-key]').forEach(b => b.onclick = () => {
  const act = b.dataset.act, key = b.dataset.key;
  if (act) sendScroll(act === 'up');
  else if (key && KEY_BYTES[key]) sendPty(KEY_BYTES[key]);
});

// ── 主题切换 ──
document.querySelectorAll('[data-set-theme]').forEach(a => a.onclick = () => {
  document.documentElement.setAttribute('data-theme', a.getAttribute('data-set-theme'));
});

// ── 键盘直输:页面获焦(非输入框)时,按键编码成终端字节 → {prefix}/pty_in ──
// 编码和服务端 bytes_from_key 同一套 xterm 规范(Ctrl+字母、方向键+修饰、F1–F12 等)。
function keyToBytes(e) {
  const k = e.key;
  if (e.ctrlKey && !e.metaKey && k.length === 1 && /[a-zA-Z]/.test(k)) {
    return String.fromCharCode(k.toUpperCase().charCodeAt(0) - 64); // ^A..\x1a
  }
  if (k.length === 1 && !e.ctrlKey && !e.metaKey) {
    return (e.altKey ? '\x1b' : '') + k; // 可打印字符;Alt 加 ESC 前缀
  }
  const n = 1 + (e.shiftKey?1:0) + (e.altKey?2:0) + (e.ctrlKey?4:0); // xterm modifier code
  const mod = n > 1;
  const csi = def => mod ? `\x1b[1;${n}${def}` : `\x1b[${def}`;
  const tilde = num => mod ? `\x1b[${num};${n}~` : `\x1b[${num}~`;
  switch (k) {
    case 'Enter':     return '\r';
    case 'Backspace': return '\x7f';
    case 'Tab':       return e.shiftKey ? '\x1b[Z' : '\t';
    case 'Escape':    return '\x1b';
    case 'ArrowUp':    return csi('A');
    case 'ArrowDown':  return csi('B');
    case 'ArrowRight': return csi('C');
    case 'ArrowLeft':  return csi('D');
    case 'Home':       return csi('H');
    case 'End':        return csi('F');
    case 'PageUp':     return tilde(5);
    case 'PageDown':   return tilde(6);
    case 'Delete':     return tilde(3);
    case 'Insert':     return tilde(2);
  }
  const f1 = /^F([1-4])$/.exec(k);
  if (f1) return `\x1bO${'PQRS'[+f1[1]-1]}`;
  const fn = { F5:15, F6:17, F7:18, F8:19, F9:20, F10:21, F11:23, F12:24 }[k];
  if (fn) return `\x1b[${fn}~`;
  return null; // 其它(Shift/Ctrl/Alt 等单独 modifier、IME 组合)忽略
}
document.addEventListener('keydown', e => {
  if (!$('kbdCapture').checked || !client || !currentPrefix) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return; // 不抢表单输入
  if (e.metaKey) return; // Cmd 组合放行给浏览器(Cmd+R 刷新等)
  const bytes = keyToBytes(e);
  if (bytes == null) return;
  e.preventDefault();
  client.publish(`${currentPrefix}/pty_in`, bytes);
});

setStatus('未连接', 'ghost');
renderSessions();
</script>
</body>
</html>
