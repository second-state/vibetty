[package]
name = "vibetty"
version = "0.3.3"
edition = "2024"


[features]
default = ["swash"]
swash = ["vibetty-screenshot/swash"]

[dependencies]
flexi_logger = "0.31"
env_logger = "0.11.6"
log = "0.4.25"
clap = { version = "4.5", features = ["derive", "env"] }
dotenv = "0.15"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

anyhow = "1.0"

axum = "0.8.1"

tokio = { version = "1", features = ["full"] }

futures-util = "0.3.32"

dirs = "6"
bytes = "1.11.1"
uuid = { version = "1.21.0", features = ["v4"] }

portable-pty = { version = "0.9.3", package = "portable-pty-psmux" }
strip-ansi-escapes = "0.2.1"

# TUI
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
tui-term = "0.3"
tui-input = "0.15"
vt100 = "0.16"

# Screenshot / Image rendering
vibetty-screenshot = { git = "https://github.com/second-state/vibetty-screenshot", tag = "v0.2.2" }
image = "0.25"
color_quant = "1.1"
png = "0.17"
rumqttc = "0.25.1"
machine-uid = "0.6.0"
sha2 = "0.11.0"
rumqttd = { version = "0.20.0", features = ["websocket"] }
# 接管 rumqttd 的 tracing 事件(它用 tracing,不是 log);见 main::logger_init 的 NullSubscriber。
tracing = "0.1"

[patch.crates-io]
# 本地补丁:vt100 0.16.2 的 scroll_up 在「滚动区顶 == 屏顶」时不把滚出的行存进 scrollback
# (上游用 !scroll_region_active(),只要设了滚动区就丢弃)。codex 这类 inline TUI 靠
# SetScrollRegion(1..viewport_top) + \r\n 把 finalized 历史顶进 scrollback,因此永远攒不出
# 历史可滚。fix:scroll_up 改成 scroll_top == 0。fork 在 second-state/vt100-rust 分支
# vibetty-scrollback-fix(commit a34c13a),已提上游 PR doy/vt100-rust#33;合并后可撤掉本补丁。
vt100 = { git = "https://github.com/second-state/vt100-rust", rev = "a34c13a" }
