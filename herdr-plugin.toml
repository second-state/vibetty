id = "vibetty"
name = "Vibetty"
version = "0.4.1"
min_herdr_version = "0.7.5"
description = "Share a Herdr agent pane over MQTT. Trigger the `share` action to open a 1-row status bar below the focused pane that bridges it to remote clients."
platforms = ["linux", "macos"]

# linux/macOS: install.sh downloads the prebuilt release binary into
# ~/.cargo/bin; VIBETTY_FALLBACK_BUILD=1 makes it build from the fetched
# checkout if the download fails. Windows: no prebuilt installer yet,
# build from source.
[[build]]
platforms = ["linux", "macos"]
command = ["bash", "-c", "VIBETTY_FALLBACK_BUILD=1 ./install.sh"]

[[build]]
platforms = ["windows"]
command = ["cargo", "install", "--path", "."]

# share action: opens the status pane below the focused agent pane.
# Target pane id is passed via VIBETTY_HERDR_TARGET env.
[[actions]]
id = "share"
title = "Share this agent pane over Vibetty"
contexts = ["pane"]
command = ["vibetty", "share-herdr"]

# 1-row status pane running `vibetty herdr` (reads target from env).
# Auto-closes when vibetty exits (plugin pane lifecycle).
[[panes]]
id = "herdr-share"
title = "Vibetty"
placement = "split"
command = ["vibetty", "herdr"]
